        margin: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        height: 100vh;
        color: var(--ink);
    }

    header {
        background: var(--navy);

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;

        flex-wrap: wrap;
    }

        display: flex;

        gap: 10px;

    header nav a:hover, header nav a:focus-visible {

    }

        background: var(--amber);

        font-weight: 700;
    }

    /* Quick actions */
    #quickActions {
        display: flex;
        gap: 8px;
        padding: 10px 16px;
        overflow-x: auto;
        background: var(--card);

    }
    .quick-btn {
        flex-shrink: 0;
        border: 1px solid #d7e0ea;
        background: #f7fafc;
        color: var(--navy);
        padding: 8px 14px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
    }
    .quick-btn:hover { background: var(--blue); color: #fff; border-color: var(--blue); }

    #chatContainer {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
        display: flex;

        border-bottom-right-radius: 4px;
    }

        background: var(--bubble-ai);

        border-bottom-left-radius: 4px;

    /* Resource chips (W3Schools etc.) */
    .resource-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
        align-self: flex-start;
        max-width: 75%;
    }
    .resource-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #fff;
        border: 1px solid #d7e0ea;
        color: var(--navy);
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 999px;

    }
    .resource-chip:hover { background: var(--amber); border-color: var(--amber); color: var(--navy); }
    .resource-chip i { color: #04AA6D; }

    #inputContainer {
        display: flex;
        gap: 10px;
        padding: 12px 16px;
        background: var(--navy);
        flex-shrink: 0;
    }
    #userInput {
        flex: 1;
        padding: 12px 14px;
        border: none;
        border-radius: 10px;
        font-size: 15px;

    }
    #sendBtn {

        border-radius: 10px;

        font-weight: 700;

        header nav a:not(.cta) { display: none; }
        .message { max-width: 88%; }
        #userInput { font-size: 14px; }
        #sendBtn { padding: 8px 15px; font-size: 14px; }

    .dot {
      width: 6px;
      height: 6px;
      background: #cfe0f2;

    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40% { opacity: 1; }

</style>

const LANG_LINKS = [

const SYSTEM_PROMPT = `

Use the supplied Tech Craft knowledge base as the source of truth for company,
service, pricing, automation, learning, contact and website questions.

IMPORTANT:
- Never invent Tech Craft services, prices, staff names, guarantees, locations,

- Published prices are ranges only. Do not quote a final price without requirements.
- If the knowledge base does not support a company-specific answer, say that you

  Tech Craft officially supports a technology merely because you can explain it.
- Keep answers professional, concise and practical.
- When useful, use these exact links:
  Website: ${SITE.website}
  Services: ${SITE.services}
  Pricing: ${SITE.pricing}
  Automation: ${SITE.automation}
  Learning: ${SITE.learning}
  Booking: ${SITE.booking}
  Email: ${SITE.email}
  Phone/WhatsApp: ${SITE.phone}
`;

const chatContainer = document.getElementById("chatContainer");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

let conversation = [{ role: "system", content: SYSTEM_PROMPT }];
let busy = false;

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function safeLink(url) {
  try {
    const u = new URL(url);
    return ["https:", "mailto:", "tel:"].includes(u.protocol) ? u.href : "#";
  } catch {
    return "#";
  }
}

function formatMessage(text) {
  let safe = escapeHTML(text);

  // Markdown links: only permit http(s).
  safe = safe.replace(
    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    (_, label, url) => `<a href="${escapeHTML(safeLink(url))}" target="_blank" rel="noopener noreferrer">${label}</a>`
  );

  // Bold.
  safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

  // Emails.
  safe = safe.replace(
    /([\w.+-]+@[\w-]+\.[\w.-]+)/g,
    '<a href="mailto:$1">$1</a>'
  );

  // Plain URLs that were not converted by markdown.
  safe = safe.replace(
    /(?<!["'=])(https?:\/\/[^\s<]+)/g,
    (url) => `<a href="${escapeHTML(safeLink(url.replace(/[),.]+$/, ""))}" target="_blank" rel="noopener noreferrer">${url}</a>`
  );

  return safe;
}

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = `message ${sender}`;
  div.innerHTML = formatMessage(text);
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function addTypingIndicator() {
  const div = document.createElement("div");
  div.className = "message ai typing";
  div.dataset.typing = "true";
  div.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  chatContainer.appendChild(div);
  chatContainer.scrollTop = chatContainer.scrollHeight;
}

function removeTypingIndicator() {
  chatContainer.querySelector('[data-typing="true"]')?.remove();
}

function addResourceChips(text) {
  const found = LANG_LINKS.filter(lang => lang.re.test(text));
  if (!found.length) return;

  const existing = new Set(
    [...chatContainer.querySelectorAll(".resource-chip")].map(a => a.dataset.lang)
  );

  const wrap = document.createElement("div");
  wrap.className = "resource-chips";

  found.forEach(lang => {
    if (existing.has(lang.name)) return;
    const a = document.createElement("a");
    a.className = "resource-chip";
    a.dataset.lang = lang.name;
    a.href = lang.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.innerHTML = `<i class="fa-solid fa-graduation-cap"></i> ${escapeHTML(lang.name)} on W3Schools`;
    wrap.appendChild(a);
  });

  if (wrap.children.length) {
    chatContainer.appendChild(wrap);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }
}

function addMessageWithTyping(text, sender, userMessage = "") {
  const div = document.createElement("div");
  div.className = `message ${sender}`;
  chatContainer.appendChild(div);

  const plain = String(text)
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, "$1")
    .replace(/\*\*([^*]+)\*\*/g, "$1");

  let index = 0;
  const interval = setInterval(() => {
    if (index < plain.length) {
      div.textContent = plain.slice(0, ++index);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    } else {
      clearInterval(interval);
      div.innerHTML = formatMessage(text);
      addResourceChips(`${text} ${userMessage}`);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  }, 8);
}

function normalise(text) {
  return text
    .toLowerCase()
    .replace(/[^\w\s+#.-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function containsAny(text, terms) {
  return terms.some(term => text.includes(term));
}

function serviceByKeywords(text) {
  return KNOWLEDGE_BASE.services.find(service =>
    service.keywords.some(keyword => text.includes(keyword))
  );
}

function companyAnswer() {
  return `${KNOWLEDGE_BASE.company.name} is an enterprise technology consultancy focused on software systems and digital transformation.

The company works on solutions such as custom enterprise applications, blockchain/FinTech integration, educational technology, branding and digital assets, automation, and AI-powered programming education.

[Visit Tech Craft Limited](https://www.techcraftlimited.tech/) or [contact the team](mailto:${SITE.email}).`;
}

function localKnowledgeAnswer(message) {
  const t = normalise(message);

  if (containsAny(t, ["hello", "hi", "hey", "good morning", "good afternoon", "who are you"])) {
    return `👋 I'm **Techcraft AI**, the assistant for Tech Craft Limited.

I can help you understand our **services, pricing, automation, learning portal and booking process**, or help with coding and ICT questions.

What would you like to know?`;
  }

  if (containsAny(t, ["contact", "email", "phone", "whatsapp", "reach you", "how can i contact"])) {
    return contactAnswer();
  }

  if (containsAny(t, ["book", "booking", "consultation", "schedule", "meeting", "quote", "quotation"])) {
    return bookingAnswer();
  }

  if (containsAny(t, ["pricing", "price", "cost", "how much", "budget", "fee", "fees"])) {
    return pricingAnswer(t);
  }

  if (containsAny(t, ["automation", "automate", "chatbot", "recruitment automation", "email automation", "social media automation"])) {
    return automationAnswer();
  }

  if (containsAny(t, ["learning portal", "learn coding", "learn to code", "tutorial", "certification", "course"])) {
    return learningAnswer();
  }

  if (containsAny(t, ["services", "service", "what do you do", "what does tech craft do", "offer"])) {
    return servicesAnswer(t);
  }

  if (containsAny(t, ["about tech craft", "about the company", "who is tech craft", "what is tech craft"])) {
    return companyAnswer();
  }

  if (containsAny(t, ["blockchain", "fintech", "crypto", "smart contract", "kyc", "mobile money", "defi"])) {
    return servicesAnswer(t);
  }

  const service = serviceByKeywords(t);
  if (service) return servicesAnswer(t);

  // No company-specific match. Return null so the coding/general AI backend
  // gets a chance to answer.
  return null;
}

async function callBackend(message) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 20000);

  try {
    const messages = [
      { role: "system", content: SYSTEM_PROMPT },
      ...conversation.filter(m => m.role !== "system").slice(-12),
      { role: "user", content: message }
    ];

    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ messages }),
      signal: controller.signal
    });

    const raw = await res.text();
    let data = {};
    try { data = raw ? JSON.parse(raw) : {}; } catch {}

    if (!res.ok) {
      throw new Error(data?.error?.message || `API returned HTTP ${res.status}`);
    }

    const answer =
      data?.choices?.[0]?.message?.content ||
      data?.message?.content ||
      data?.output_text ||
      data?.response ||
      data?.answer;

    if (!answer || typeof answer !== "string") {
      throw new Error("The API returned no assistant message.");
    }

    return answer.trim();
  } finally {
    clearTimeout(timeout);
  }
}

function backendFallback(message, error) {
  console.warn("Techcraft AI backend unavailable:", error);

  const tech = detectLanguages(message);
  const techName = tech.length ? tech[0].name : null;

  if (techName) {
    return `I can help with **${techName}**, but the live AI coding service is temporarily unavailable.

You can still use the ${techName} learning resource below, or contact Tech Craft Limited if this is a project request.

[Learn ${techName} on W3Schools](${tech[0].url})

📧 [${SITE.email}](mailto:${SITE.email})
📱 [${SITE.phone}](tel:${SITE.phone.replace(/\s/g, "")})`;
  }

  return `I can answer Tech Craft Limited questions directly, but the live AI service is temporarily unavailable for this request.

Try asking about **services, pricing, automation, learning, booking or contact details**, or reach Tech Craft directly at [${SITE.email}](mailto:${SITE.email}) / [${SITE.phone}](tel:${SITE.phone.replace(/\s/g, "")}).`;
}

async function sendMessage(overrideText) {
  if (busy) return;

  const message = (overrideText !== undefined ? overrideText : userInput.value).trim();
  if (!message) return;

  busy = true;
  sendBtn.disabled = true;
  userInput.value = "";

  addMessage(message, "user");
  conversation.push({ role: "user", content: message });
  addTypingIndicator();

  try {
    // Hard-coded Tech Craft knowledge is deliberately checked first.
    let answer = localKnowledgeAnswer(message);

    if (!answer) {
      try {
        answer = await callBackend(message);
      } catch (err) {
        answer = backendFallback(message, err);
      }
    }

    removeTypingIndicator();
    conversation.push({ role: "assistant", content: answer });
    addMessageWithTyping(answer, "ai", message);

    // Keep memory bounded to avoid huge requests.
    if (conversation.length > 25) {
      conversation = [
        conversation[0],
        ...conversation.slice(-20)
      ];
    }
  } catch (err) {
    console.error("Unexpected assistant error:", err);
    removeTypingIndicator();
    const safeFallback = "I couldn't complete that request. Please try again, or contact Tech Craft Limited at techcraft.bookings@gmail.com / +254 792 627 702.";
    conversation.push({ role: "assistant", content: safeFallback });
    addMessage(safeFallback, "ai");
  } finally {
    busy = false;
    sendBtn.disabled = false;
    userInput.focus();
  }
}

const QUICK_PROMPTS = {
  services: "What services does Tech Craft Limited offer?",
  pricing: "What are Tech Craft Limited's published prices?",
  booking: "How do I book a consultation?",
  contact: "How can I contact Tech Craft Limited?",
  learn: "What can I learn through the Tech Craft Learning Portal?",
  blockchain: "Tell me about Tech Craft's blockchain and FinTech services."
};

document.getElementById("quickActions").addEventListener("click", event => {
  const btn = event.target.closest(".quick-btn");
  if (!btn) return;

  const action = btn.dataset.action;
  if (action === "booking") {
    window.open(SITE.booking, "_blank", "noopener,noreferrer");
    return;
  }

  sendMessage(QUICK_PROMPTS[action] || "Tell me about Tech Craft Limited.");
});

sendBtn.addEventListener("click", () => sendMessage());

userInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

window.addEventListener("load", () => {
  const greeting =
    "👋 Hey! I'm **Techcraft AI**, the assistant for Tech Craft Limited.\n\n" +
    "I can answer questions about our **services, pricing, automation, learning portal and consultations**, and I can also help with coding and ICT questions.\n\n" +
    "[Book a consultation](https://www.techcraftlimited.tech/booking.html) or ask me anything.";

  conversation.push({ role: "assistant", content: greeting });
  addMessageWithTyping(greeting, "ai");
});
</script>
